name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonav1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # This is the compiler release, rather than the Moon CLI date version.
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: Resolve registry dependencies
        run: moon update

      - name: Type check
        run: moon check --target ${{ matrix.target }}

      - name: Build
        run: moon build --target ${{ matrix.target }}

      - name: Verify committed public interface
        run: |
          moon info --target ${{ matrix.target }}
          git diff --exit-code -- pkg.generated.mbti

      - name: Test
        run: moon test --target ${{ matrix.target }}

      - name: Run public API example
        run: |
          moon run examples/decode --target ${{ matrix.target }}
          moon run examples/native_pixels --target ${{ matrix.target }}
          moon run examples/extensions --target ${{ matrix.target }}
          moon run examples/containers --target ${{ matrix.target }}
